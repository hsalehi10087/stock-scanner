timeframe: 1d
start: '1993-02-01'
notes: >-
  متن کامل مقاله در دسترس نبود؛ قانون مشهور ۱۰ ماهه پیاده شد: در بازار بمان وقتی قیمت بالای میانگین ۱۰ ماهه است،
  وگرنه نقد. ۱۰ ماه ≈ ۲۱۰ روز معاملاتی (تقریب). قانون اصلی فقط آخر هر ماه بررسی می‌شود، اینجا هر روز بررسی می‌شود،
  پس تعداد معاملات بیشتر از نسخه‌ی ماهانه است. نماد گفته نشده، SPY گذاشته شد. فقط خرید.
