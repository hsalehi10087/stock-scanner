claim: "«میانگین متحرک ۱۰ ماهه مشهورترین قانون سرمایه‌گذاری تاکتیکی است؛ ۸۸٪ مواقع با فیلتر مومنتوم هم‌نظر است و دو برابر بیشتر معامله می‌کند»"
claimed_return: "agrees with momentum filter 88% of the time"
added: 2026-10-26
