notes: >-
  متن کامل مقاله در دسترس نبود؛ فقط عنوان و خلاصه. باند پایینی به روش رایج (Price Headley) با دوره‌ی ۲۰ فرض شد:
  میانگین ۲۰ روزه‌ی low×(1−4×(high−low)/(high+low)). چون موتور این فرمول را مستقیم ندارد، تقریب زده شد:
  ۳×میانگین۲۰ low − ۲×میانگین۲۰ high (یعنی میانگین low منهای ۲ برابر میانگین دامنه‌ی روز؛ خطای تقریب ناچیز).
  «اولین برگشت» = اولین روزی که بسته‌شدن بالاتر از بسته‌شدن روز قبل است. حد ضرر گفته نشده، گذاشته نشد.
  شروع از آغاز داده‌ی QQQ (۱۹۹۹، حدود ۲۷ سال). فقط خرید.
