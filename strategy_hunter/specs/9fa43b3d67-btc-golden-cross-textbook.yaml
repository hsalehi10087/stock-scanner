claim: "«۹ موردی که بعد از هزینه‌ها سودده ماندند: تقاطع طلایی روی BTC (‎+۳۰٪)، طلا (‎+۲۷٪) و EUR/USD (‎+۱۲٪)… تقاطع طلایی روی BTC فقط ۷۸ معامله در نزدیک ۶ سال داشت، که برای اینکه آن را مزیت بدانیم و نه شانس، خیلی کم است.» — ژانویه ۲۰۲۱ تا نوامبر ۲۰۲۶، قانون‌های کتابی، ریسک ۱٪ در هر معامله، با هزینه‌ها"
claimed_return: "+30% (2021-2026, after costs)"
added: 2026-11-16
status: implemented
asset_class: crypto
symbols: [BTC-USD]
timeframe: 1d
start: '2021-01-01'
notes: >-
  نویسنده فقط گفته «قانون کتابی تقاطع طلایی» روی تایم‌فریم رایج آن؛ فرض شده: روزانه، میانگین ساده‌ی ۵۰ و ۲۰۰ روزه،
  خرید وقتی ۵۰ از پایین ۲۰۰ را قطع کند و خروج وقتی از بالا قطع کند. فقط خرید آزموده می‌شود (معلوم نیست فروش هم داشته یا نه؛
  ۷۸ معامله در ۶ سال احتمالاً تایم‌فریم کوتاه‌تر یا خرید و فروش را نشان می‌دهد).
  حد ضرر و اندازه‌ی پوزیشن با ریسک ۱٪ گفته نشده، پس اینجا تمام سرمایه بدون حد ضرر است. نتایج طلا و EUR/USD آزموده نمی‌شوند.
