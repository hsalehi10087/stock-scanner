notes: >-
  فقط پایه‌ی «خرید در فروش‌بیش‌ازحد» آزموده می‌شود، چون به گفته‌ی نویسنده بیشترِ بازده از همین بخش است؛
  سبد ۲۰٪ TQQQ و ۸۰٪ دارایی‌های دیگر، سوئیچ ‎±۳٪‎ دور میانگین ۲۰۰ روزه و پایه‌ی SQQQ بالای RSI ۸۰ آزموده نمی‌شوند.
  موتور تک‌دارایی است، پس سیگنال و معامله هر دو روی QQQ است (در اصل معامله روی TQQQ با اهرم ۳ برابر).
  فرض: «تا وقتی RSI برگردد» یعنی خروج وقتی RSI چهارده‌روزه دوباره بالای ۳۰ بسته شود. متن کامل پست در دسترس نبود.
  معامله در بازگشایی روز بعد انجام می‌شود (در اصل در بسته‌شدن همان روز). عدد ۳۰٪ مربوط به کل سبد است و مستقیم قابل مقایسه نیست.
