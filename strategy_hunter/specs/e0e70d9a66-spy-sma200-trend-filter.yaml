notes: >-
  متن کامل مقاله در دسترس نبود (فقط خلاصه‌ی آن). فرض: میانگین ساده‌ی ۲۰۰ روزه، خرید وقتی بسته‌شدن بالای آن است
  و خروج به نقد وقتی بسته‌شدن زیر آن است، بدون باند. بازه‌ی زمانی آزمون مقاله معلوم نیست، از ابتدای داده‌ی SPY آزموده می‌شود.
  ادعا درباره‌ی کاهش افت است نه سود بیشتر. فقط خرید.
