name: 📨 Strategy Hunter — daily report (19:00 Tehran)

on:
  schedule:
    - cron: '30 15 * * *'   # ساعت ۱۹:۰۰ به وقت تهران
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'شناسه چت (none = بدون ارسال)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: hunter-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy pyyaml requests matplotlib
      - run: python3 strategy_hunter/evaluate.py
      - name: Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 strategy_hunter/report.py
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Strategy Hunter"
          git add -f data/strategy_hunter || true
          git diff --cached --quiet && exit 0
          git commit -q -m "📨 hunter report $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
