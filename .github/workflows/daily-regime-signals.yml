name: 📊 Daily Comprehensive Report (10 AM Tehran)

on:
  schedule:
    # هر روز ساعت 10 صبح تهران = 6:30 صبح UTC
    - cron: '30 6 * * *'  # UTC
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scipy scikit-learn yfinance
      
      - name: Load environment variables
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
      
      - name: Run all daily reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd stock-scanner
          echo "📊 Running Daily Comprehensive Report..."
          python3 daily_comprehensive_report.py
          
          echo ""
          echo "🐋 Running Smart Investors Report..."
          python3 smart_investors_shared_stocks.py
          
          echo ""
          echo "📈 Running Daily Regime Signals..."
          python3 daily_regime_signals.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Daily regime signals report - $(date +'%Y-%m-%d')" && git push)
