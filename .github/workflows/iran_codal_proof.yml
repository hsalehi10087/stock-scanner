name: 🇮🇷 Codal proof (one symbol)

# این گردش‌کار باید روی سرور داخل ایران اجرا شود (self-hosted runner با برچسب iran).
# سرورهای گیت‌هاب (ubuntu-latest، آمریکا) به کدال و TSETMC دسترسی ندارند (آزمایش ۲۰۲۶-۱۰-۱۵).
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'نماد'
        required: false
        default: 'فولاد'

permissions:
  contents: write

jobs:
  proof:
    runs-on: [self-hosted, iran]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python3 -m pip install -q --user requests pandas
      - name: Fetch and validate
        run: python3 iran/codal_one_symbol.py "${{ github.event.inputs.symbol }}"
      - name: Save outputs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Iran Codal Bot"
          git add -f data/iran || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🇮🇷 codal proof $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
