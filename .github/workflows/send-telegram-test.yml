name: 📨 Send Telegram Test Message

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'متن پیام'
        required: false
        default: '✅ پیام تست: ارسال دستی از Claude به گروه انجام شد.'
      chat_id:
        description: 'شناسهٔ گروه'
        required: false
        default: '-5382888333'
      token:
        description: 'توکن ربات (اختیاری؛ اگر خالی باشد از secret استفاده می‌شود)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        env:
          TG_TOKEN: ${{ github.event.inputs.token || secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ github.event.inputs.chat_id }}
          TG_TEXT: ${{ github.event.inputs.text }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "❌ No bot token provided (input 'token' or secret TELEGRAM_BOT_TOKEN)"
            exit 1
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TG_TEXT}" \
            -o resp.json -w "HTTP %{http_code}\n"
          cat resp.json; echo
          grep -q '"ok":true' resp.json
