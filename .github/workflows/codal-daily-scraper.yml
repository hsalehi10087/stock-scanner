name: 📊 Codal Daily Scraper & Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'  # 10 AM Tehran = 6:30 UTC

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install packages
        run: |
          pip install -q -r requirements.txt

      - name: Create .env
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::add-mask::$TG_TOKEN"
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' "$TG_TOKEN" "$TG_CHAT" > .env

      - name: 🌐 Scrape Codal.ir
        run: |
          echo "🚀 شروع scraping codal.ir..."
          python3 codal_scraper_live.py
          echo "✅ scraping تکمیل شد"

      - name: 🔍 Analyze Reports
        run: |
          echo "📊 تحلیل گزارش‌ها..."
          python3 codal_analyzer_live.py
          echo "✅ تحلیل تکمیل شد"

      - name: 📱 Send Telegram Report
        run: |
          echo "📢 ارسال گزارش به تلگرام..."
          python3 -u codal_telegram_report.py 2>&1 || echo "⚠️ خطا در ارسال"
          echo "✅ تکمیل شد"

      - name: 💾 Commit History
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Codal Scraper"

          if [ -f "data/codal_history.csv" ]; then
            git add data/codal_history.csv 2>/dev/null || true
            git diff --cached --quiet || (git commit -m "📊 Update Codal history - $(date +%Y-%m-%d)" && git push) || true
            echo "✅ History sync مکمل"
          fi
