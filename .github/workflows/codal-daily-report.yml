name: 📊 Codal Daily Report (10 AM Tehran)

on:
  # ساعت 10 صبح تهران = 6:30 صبح UTC
  schedule:
    - cron: '30 6 * * *'
  # دستی اجرا کردن
  workflow_dispatch:

jobs:
  codal-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 requests
        continue-on-error: false

      - name: Debug - Check Secrets
        run: |
          echo "🔍 بررسی Secrets..."
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN موجود نیست!"
          else
            echo "✅ TELEGRAM_BOT_TOKEN موجود است"
          fi

          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "❌ TELEGRAM_CHAT_ID موجود نیست!"
          else
            echo "✅ TELEGRAM_CHAT_ID موجود است"
          fi

      - name: Run Codal Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 شروع گزارش کودال..."
          echo "⏰ زمان: $(date)"
          echo ""

          # اگر Secrets موجود است
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ Secrets موجود نیست!"
            echo "📌 باید اینها رو GitHub Settings اضافه کنی:"
            echo "   1. TELEGRAM_BOT_TOKEN"
            echo "   2. TELEGRAM_CHAT_ID"
            exit 1
          fi

          python3 codal_daily_report.py

          echo ""
          echo "✅ تکمیل شد!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: workflow-logs
          path: '*'
          retention-days: 7
