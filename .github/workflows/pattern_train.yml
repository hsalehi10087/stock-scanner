name: 🔍 Pattern Hunter — learn winner patterns (monthly)

on:
  schedule:
    - cron: '0 20 1 * *'   # اول هر ماه
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        market: [us, cn, in, jp, tw]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy scikit-learn joblib requests lxml openpyxl deep-translator
      - run: python3 pattern_hunter/train.py ${{ matrix.market }}
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pattern Hunter"
          git add -f data/pattern_hunter || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🔍 pattern model ${{ matrix.market }} $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 10)); done
