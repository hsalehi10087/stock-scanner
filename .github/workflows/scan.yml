name: Daily RSI-MACD scan

on:
  schedule:
    - cron: "0 3 * * 2-6"
  workflow_dispatch:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.50" pandas numpy requests lxml
      - run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: "8752723544:AAGqy9vW0YjmNWIwqthiHRwpGsC-gaygjO4"
          TELEGRAM_CHAT_ID: "75439320"
