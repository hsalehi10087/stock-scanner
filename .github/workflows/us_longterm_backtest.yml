name: 🧪 US long-term backtest (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'backtest_core یا miners_returns'
        required: false
        default: 'backtest_core'
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy
      - name: Run script
        run: python3 us_longterm/${{ github.event.inputs.script || 'backtest_core' }}.py
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Backtest Bot"
          git add -f data/us_longterm || true
          git diff --cached --quiet || (git commit -m "🧪 core backtest" && git pull --rebase -q && git push -q)
