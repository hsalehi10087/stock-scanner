name: 📊 Send All Reports to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'  # 10 AM Tehran

jobs:
  send-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install beautifulsoup4 requests
          pip install python-dotenv

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=8752723544:AAElnbyf_wIVDcpTlJJ-VoKsx7QHaaolZ54
          TELEGRAM_CHAT_ID=-5408618772
          EOF

      - name: Send All Reports
        run: |
          echo "🚀 ارسال تمام گزارش‌ها..."

          echo "📰 Daily Summary..."
          python3 daily_summary_report.py || true
          sleep 2

          echo "📊 Comprehensive..."
          python3 daily_comprehensive_report.py || true
          sleep 2

          echo "📈 Regime Signals..."
          python3 daily_regime_signals.py || true
          sleep 2

          echo "🌍 Macro Report..."
          python3 smart_macro_report.py || true
          sleep 2

          echo "🏦 Codal Daily..."
          python3 codal_daily_report.py || true

          echo "✅ تمام پیام‌ها ارسال شدند!"
