name: 📊 Send All Reports to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'  # 10 AM Tehran

jobs:
  send-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install beautifulsoup4 requests
          pip install python-dotenv

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=8752723544:AAElnbyf_wIVDcpTlJJ-VoKsx7QHaaolZ54
          TELEGRAM_CHAT_ID=-5408618772
          EOF

      - name: Send Hedge Fund Report (Daily)
        run: |
          echo "🐋 گزارش سرمایه‌گذاران بزرگ..."
          python3 hedge_fund_filtered_report.py
          sleep 2

      - name: Send Monthly Digest (Strong Signals Only)
        run: |
          echo "📊 خلاصهٔ ماهانه..."
          python3 monthly_digest_report.py
          echo "✅ تمام گزارش‌ها ارسال شدند!"
