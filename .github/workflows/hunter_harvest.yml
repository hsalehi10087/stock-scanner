name: 🔎 Strategy Hunter — harvest claims

on:
  schedule:
    - cron: '10 */6 * * *'   # هر ۶ ساعت
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunter-data
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - run: python3 strategy_hunter/harvest.py
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Strategy Hunter"
          git add -f data/strategy_hunter || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🔎 hunter harvest $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
