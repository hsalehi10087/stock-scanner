name: 🤖 AI stocks — metrics (after US close) and report (08:30 Tehran)

on:
  schedule:
    # زمان‌بندی GitHub گاهی چند ساعت دیر اجرا می‌شود؛ پس داده بعد از بسته شدن بازار آمریکا ساخته می‌شود (قیمت‌ها نهایی‌اند)
    # و کار روزانه‌ی Claude اگر داده کهنه بود، خودش metrics را با workflow_dispatch اجرا می‌کند و بعد از push گزارش را می‌فرستد.
    - cron: '23 21 * * *'  # ۰۰:۵۳ تهران: داده‌ی بنیادی و قیمتی + کارنامه
    - cron: '7 5 * * *'      # ۰۸:۳۷ تهران: پشتیبان ارسال گزارش (اگر Claude قبلاً فرستاده باشد، دوباره نمی‌فرستد)
  workflow_dispatch:
    inputs:
      step:
        description: 'metrics یا report یا scorecard'
        required: false
        default: 'metrics'
      chat_id:
        description: 'شناسه چت (none = بدون ارسال)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ai-stocks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas requests
      - name: Metrics
        if: github.event.schedule == '23 21 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'metrics')
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          echo "::add-mask::$FINNHUB_API_KEY"
          python3 market_intel/ai_metrics.py
      - name: Scorecard
        if: github.event.schedule == '23 21 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.step == 'metrics' || github.event.inputs.step == 'scorecard'))
        continue-on-error: true
        run: python3 market_intel/ai_scorecard.py
      - name: Report
        if: github.event.schedule == '7 5 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'report')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 market_intel/ai_report.py
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Stocks Bot"
          git add -f data/ai_stocks data/quality || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🤖 ai stocks $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
