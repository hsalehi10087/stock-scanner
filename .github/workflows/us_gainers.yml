name: 🚀 US Gainers >10% (daily)

on:
  schedule:
    - cron: '30 1 * * *'  # هر روز ساعت ۵:۰۰ صبح تهران (۰۱:۳۰ UTC)
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'شناسه چت(ها) با کاما'
        required: false
        default: '75439320'

permissions:
  contents: write

jobs:
  gainers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install -q yfinance pandas requests matplotlib deep-translator arabic-reshaper python-bidi
      - name: Scan and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          python3 market_intel/gainers.py
      - name: Save history
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Gainers Bot"
          git add -f data/gainers || true
          git diff --cached --quiet || (git commit -m "🚀 gainers $(date +%Y-%m-%d)" && git pull --rebase -q && git push -q)
