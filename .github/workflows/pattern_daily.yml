name: 🔍 Pattern Hunter — daily picks and report (≈07:00 Tehran)

on:
  # زمان‌بندی روزانه به digest2.yml منتقل شد (اسکن + گزارش در «گزارش میان‌صبح»)؛ این گردش‌کار فقط دستی است
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'شناسه چت (none = بدون ارسال)'
        required: false
        default: ''
      only_report:
        description: 'فقط گزارش احتمال رشد (بدون اسکن دوباره)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: pattern-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas numpy scikit-learn joblib requests matplotlib scipy
      - if: github.event.inputs.only_report != 'true'
        run: python3 pattern_hunter/daily.py
      - name: Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          # گزارش جداگانه‌ی الگویاب دیگر فرستاده نمی‌شود؛ رتبه‌ی الگوی آماری داخل گزارش «احتمال رشد» آمده است
          python3 pattern_hunter/growth_report.py
          # خودسنجی ماهانه: هر روز ذخیره می‌شود، پیام فقط شنبه‌ی اول هر ماه
          python3 pattern_hunter/growth_review.py || echo "review failed"
      - name: Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pattern Hunter"
          git add -f data/pattern_hunter data/growth_signal data/quality || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🔍 pattern picks $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
